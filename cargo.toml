[package]
name = "ipv6-pool-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ipv6-pool-proxy"
path = "main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
rand = "0.10.1"
socket2 = { version = "0.6.3", features = ["all"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true